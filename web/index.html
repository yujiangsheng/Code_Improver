<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ada — 自动代码改进智能体</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --border: #30363d; --text: #c9d1d9; --muted: #8b949e;
    --accent: #58a6ff; --green: #3fb950; --yellow: #d29922;
    --red: #f85149; --purple: #bc8cff; --orange: #ffa657;
    --cyan: #56d364; --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── header ── */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 18px; font-weight: 600; color: var(--accent); flex: 1; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge-idle    { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .badge-running { background: #1f6feb33; color: var(--accent); border: 1px solid var(--accent); }
  .badge-done    { background: #23863626; color: var(--green); border: 1px solid var(--green); }
  .badge-error   { background: #f8514920; color: var(--red); border: 1px solid var(--red); }
  .step-badge { font-size: 11px; color: var(--muted); }

  btn-danger { display: inline-flex; align-items: center; gap: 6px; }
  button { cursor: pointer; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; padding: 6px 14px; transition: opacity .15s; }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary  { background: var(--accent); color: #0d1117; }
  .btn-stop     { background: var(--yellow); color: #0d1117; }
  .btn-danger   { background: var(--red); color: #fff; }
  .btn-ghost    { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  /* ── layout ── */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ── left panel: config ── */
  .panel-config { width: 300px; min-width: 240px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
  .panel-config h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 14px 16px 6px; }
  .field { padding: 6px 16px; display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field textarea, .field select {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 7px 10px; font-size: 13px; font-family: inherit; width: 100%;
    outline: none; resize: vertical;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { min-height: 80px; }
  .action-row { padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── middle: feed ── */
  .panel-feed { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .feed-header { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .feed-header span { flex: 1; }
  #feed { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }

  .entry { border-radius: var(--radius); padding: 8px 12px; font-size: 13px; line-height: 1.6; word-break: break-word; }
  .entry-step      { background: var(--surface2); color: var(--muted); font-size: 12px; text-align: center; border: 1px solid var(--border); }
  .entry-assistant { background: #1f6feb1a; border: 1px solid #1f6feb44; white-space: pre-wrap; }
  .entry-tool      { background: #bc8cff18; border: 1px solid #bc8cff33; font-family: monospace; font-size: 12px; }
  .entry-tool-result { background: #23863618; border: 1px solid #23863633; font-family: monospace; font-size: 12px; }
  .entry-log       { background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  .entry-ask       { background: #d2992218; border: 2px solid var(--yellow); }
  .entry-finish    { background: #23863626; border: 2px solid var(--green); white-space: pre-wrap; }
  .entry-error     { background: #f8514918; border: 1px solid var(--red); color: var(--red); }
  .entry-user      { background: #58a6ff18; border: 1px solid #58a6ff44; align-self: flex-end; max-width: 80%; }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
  .tag-step     { background: var(--surface2); color: var(--muted); }
  .tag-tool     { background: #bc8cff33; color: var(--purple); }
  .tag-result   { background: #23863633; color: var(--green); }
  .tag-ask      { background: #d2992233; color: var(--yellow); }
  .tag-finish   { background: #23863633; color: var(--green); }
  .tag-user     { background: #58a6ff33; color: var(--accent); }
  .tag-error    { background: #f8514933; color: var(--red); }

  /* ── right panel: feedback ── */
  .panel-feedback { width: 300px; min-width: 220px; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; }
  .panel-feedback h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 14px 16px 6px; border-bottom: 1px solid var(--border); }
  #ask-notice { padding: 10px 16px; background: #d2992218; border-bottom: 1px solid var(--yellow); font-size: 13px; color: var(--yellow); display: none; }
  #ask-notice.active { display: block; }
  #ask-question { padding: 8px 16px 4px; font-size: 13px; color: var(--text); font-style: italic; display: none; }
  #ask-question.active { display: block; }
  .feedback-body { flex: 1; display: flex; flex-direction: column; padding: 12px 16px; gap: 10px; }
  #feedback-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 10px; font-size: 13px; font-family: inherit; outline: none; resize: none; min-height: 120px; }
  #feedback-input:focus { border-color: var(--accent); }
  #feedback-send { width: 100%; }
  .history-title { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #feedback-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .hist-item { background: var(--surface2); border-radius: 6px; padding: 8px 10px; font-size: 12px; border: 1px solid var(--border); }
  .hist-item .from { font-size: 11px; color: var(--muted); margin-bottom: 2px; }

  /* ── directory picker modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 520px; max-width: 95vw; max-height: 75vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,.6); }
  .modal-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .modal-header h3 { flex: 1; font-size: 14px; font-weight: 600; }
  .modal-path { padding: 8px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); font-family: monospace; font-size: 12px; color: var(--accent); word-break: break-all; }
  .modal-body { flex: 1; overflow-y: auto; padding: 6px 0; }
  .dir-item { display: flex; align-items: center; gap: 8px; padding: 6px 16px; cursor: pointer; font-size: 13px; border-radius: 0; }
  .dir-item:hover { background: var(--surface2); }
  .dir-item .icon { font-size: 15px; flex-shrink: 0; }
  .dir-item .dname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir-item .arrow { color: var(--muted); font-size: 11px; }
  .dir-sep { font-size: 11px; color: var(--muted); padding: 4px 16px; letter-spacing: .06em; }
  .modal-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .modal-footer .selected-path { flex: 1; font-size: 12px; color: var(--muted); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────── -->
<header>
  <h1>⚡ Ada</h1>
  <span id="status-badge" class="badge badge-idle">Idle</span>
  <span id="step-badge" class="step-badge"></span>
  <button class="btn-stop" id="btn-stop" disabled onclick="stopSession()">⏹ 停止</button>
  <button class="btn-danger" id="btn-exit" onclick="exitServer()">🔴 退出服务</button>
</header>

<!-- ── LAYOUT ─────────────────────────────────────────────── -->
<div class="layout">

  <!-- LEFT: config -->
  <aside class="panel-config">
    <h2>配置</h2>

    <div class="field">
      <label>目标目录</label>
      <div style="display:flex;gap:6px">
        <input id="cfg-dir" type="text" placeholder="/path/to/project" value="" style="flex:1">
        <button class="btn-ghost" style="padding:6px 10px;flex-shrink:0" onclick="openPicker()" title="资源管理器选择目录">📁</button>
      </div>
    </div>
    <div class="field">
      <label>改进目标 (USER_GOAL)</label>
      <textarea id="cfg-goal" placeholder="例如：让所有测试通过并消除 lint 警告"></textarea>
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:6px">
        Worker 模型
        <button class="btn-ghost" style="padding:2px 6px;font-size:11px;margin-left:auto" onclick="refreshModels()" title="刷新 Ollama 模型列表">🔄</button>
      </label>
      <div style="display:flex;gap:6px">
        <select id="cfg-model-select" style="flex:1" onchange="syncModelInput('model')"></select>
        <input id="cfg-model" type="text" placeholder="qwen3.5:9b" style="flex:1;display:none">
      </div>
    </div>
    <div class="field">
      <label>Planner 模型</label>
      <div style="display:flex;gap:6px">
        <select id="cfg-planner-select" style="flex:1" onchange="syncModelInput('planner')"></select>
        <input id="cfg-planner" type="text" placeholder="qwen3.5:27b" style="flex:1;display:none">
      </div>
    </div>
    <div class="field">
      <label>最大步数</label>
      <input id="cfg-steps" type="number" value="80" min="5" max="500">
    </div>
    <div class="field">
      <label>命令超时 (秒)</label>
      <input id="cfg-timeout" type="number" value="120" min="10" max="600">
    </div>
    <div class="action-row">
      <button class="btn-primary" id="btn-start" onclick="startSession()">▶ 启动 Ada</button>
      <button class="btn-ghost" onclick="clearFeed()">🗑 清空日志</button>
    </div>

    <!-- summary -->
    <h2 style="margin-top:8px">最终摘要</h2>
    <div id="summary-box" style="padding:10px 16px;font-size:13px;color:var(--muted);font-style:italic">
      (Ada 完成后显示)
    </div>
  </aside>

  <!-- MIDDLE: feed -->
  <main class="panel-feed">
    <div class="feed-header">
      <span>实时日志</span>
      <button class="btn-ghost" style="font-size:11px;padding:3px 8px" onclick="toggleAutoScroll()" id="btn-autoscroll">⬇ 自动滚动: ON</button>
    </div>
    <div id="feed"></div>
  </main>

  <!-- RIGHT: feedback -->
  <aside class="panel-feedback">
    <h2>用户反馈</h2>
    <div id="ask-notice" class="">⚠ Ada 正在等待您的回复</div>
    <div id="ask-question" class=""></div>
    <div class="feedback-body">
      <textarea id="feedback-input" placeholder="在此输入对 Ada 的指令或回复…&#10;&#10;按 Ctrl+Enter 发送"></textarea>
      <button class="btn-primary" id="feedback-send" onclick="sendFeedback()">📤 发送反馈</button>
      <div class="history-title">反馈历史</div>
      <div id="feedback-history"></div>
    </div>
  </aside>
</div>

<!-- ── DIRECTORY PICKER MODAL ─────────────────────────────── -->
<div id="picker-overlay" class="modal-overlay hidden" onclick="pickerOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h3>📁 选择目录</h3>
      <button class="btn-ghost" style="padding:4px 8px" onclick="closePicker()">✕</button>
    </div>
    <div class="modal-path" id="picker-current-path"></div>
    <div class="modal-body" id="picker-body"></div>
    <div class="modal-footer">
      <span class="selected-path" id="picker-selected">未选择</span>
      <button class="btn-ghost" onclick="pickerUp()">⬆ 上级</button>
      <button class="btn-primary" onclick="confirmPicker()">✓ 选择此目录</button>
    </div>
  </div>
</div>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let currentSid = null;
let es = null;
let autoScroll = true;
let waitingForFeedback = false;

// ── helpers ──────────────────────────────────────────────────────────────────
const feed = () => document.getElementById('feed');
const $ = id => document.getElementById(id);

function setStatus(label, cls) {
  const b = $('status-badge');
  b.textContent = label;
  b.className = 'badge ' + cls;
}
function setStep(n) {
  $('step-badge').textContent = n ? `Step ${n}` : '';
}

function addEntry(cls, html) {
  const div = document.createElement('div');
  div.className = 'entry ' + cls;
  div.innerHTML = html;
  feed().appendChild(div);
  if (autoScroll) div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return div;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  $('btn-autoscroll').textContent = `⬇ 自动滚动: ${autoScroll ? 'ON' : 'OFF'}`;
}
function clearFeed() { feed().innerHTML = ''; }

// ── directory picker ─────────────────────────────────────────────────────────
let pickerPath = '';

async function openPicker() {
  const initial = $('cfg-dir').value.trim() || '';
  await loadPicker(initial || null);
  $('picker-overlay').classList.remove('hidden');
}
function closePicker() {
  $('picker-overlay').classList.add('hidden');
}
function pickerOverlayClick(e) {
  if (e.target === $('picker-overlay')) closePicker();
}
async function pickerUp() {
  const cur = $('picker-current-path').textContent;
  await loadPicker(cur, true);
}
async function loadPicker(path, goUp = false) {
  const url = '/api/browse?path=' + encodeURIComponent(goUp ? '__UP__:' + (path||'') : (path||''));
  const realUrl = goUp
    ? '/api/browse?path=' + encodeURIComponent('__PARENT__')  // unused
    : '/api/browse?path=' + encodeURIComponent(path || '');

  // build actual URL
  let fetchUrl;
  if (goUp) {
    fetchUrl = '/api/browse?path=' + encodeURIComponent(path || '') + '&up=1';
  } else {
    fetchUrl = '/api/browse?path=' + encodeURIComponent(path || '');
  }
  const res = await fetch(fetchUrl);
  const data = await res.json();
  pickerPath = data.current;
  $('picker-current-path').textContent = data.current;
  $('picker-selected').textContent = data.current;

  const body = $('picker-body');
  body.innerHTML = '';

  // parent link
  if (data.parent) {
    const el = document.createElement('div');
    el.className = 'dir-item';
    el.innerHTML = '<span class="icon">⬆</span><span class="dname" style="color:var(--muted)">..</span>';
    el.onclick = () => loadPicker(data.parent);
    body.appendChild(el);
  }

  function makeItem(d) {
    const el = document.createElement('div');
    el.className = 'dir-item';
    el.innerHTML =
      `<span class="icon">📁</span>` +
      `<span class="dname">${escHtml(d.name)}</span>` +
      (d.has_sub ? '<span class="arrow">›</span>' : '');
    el.onclick = () => { $('picker-selected').textContent = d.path; pickerPath = d.path; };
    el.ondblclick = () => loadPicker(d.path);
    return el;
  }

  data.dirs.forEach(d => body.appendChild(makeItem(d)));

  if (data.hidden && data.hidden.length) {
    const sep = document.createElement('div');
    sep.className = 'dir-sep';
    sep.textContent = '— 隐藏目录 —';
    body.appendChild(sep);
    data.hidden.forEach(d => body.appendChild(makeItem(d)));
  }

  if (!data.dirs.length && !(data.hidden && data.hidden.length)) {
    const empty = document.createElement('div');
    empty.className = 'dir-sep';
    empty.textContent = '(空目录)';
    body.appendChild(empty);
  }
}
function confirmPicker() {
  $('cfg-dir').value = pickerPath || $('picker-selected').textContent;
  closePicker();
}

// ── ollama model picker ──────────────────────────────────────────────────────
const CUSTOM_OPT = '__custom__';
const DEFAULT_WORKER  = 'qwen3.5:9b';
const DEFAULT_PLANNER = 'qwen3.5:27b';

function populateSelect(selId, inputId, models, defaultVal) {
  const sel = $(selId);
  const cur = sel.value && sel.value !== CUSTOM_OPT ? sel.value : defaultVal;
  sel.innerHTML = '';
  models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = opt.textContent = m;
    if (m === cur) opt.selected = true;
    sel.appendChild(opt);
  });
  // "自定义" option
  const customOpt = document.createElement('option');
  customOpt.value = CUSTOM_OPT;
  customOpt.textContent = '— 自定义模型… —';
  if (!models.includes(cur)) { customOpt.selected = true; }
  sel.appendChild(customOpt);
  syncModelInput(selId === 'cfg-model-select' ? 'model' : 'planner');
}

async function refreshModels() {
  try {
    const res = await fetch('/api/models');
    const data = await res.json();
    const models = data.models && data.models.length ? data.models : [DEFAULT_WORKER, DEFAULT_PLANNER];
    populateSelect('cfg-model-select',   'cfg-model',   models, DEFAULT_WORKER);
    populateSelect('cfg-planner-select', 'cfg-planner', models, DEFAULT_PLANNER);
  } catch(e) {
    // Ollama not reachable — fall back to text inputs
    ['model', 'planner'].forEach(t => showCustomInput(t));
  }
}

function syncModelInput(type) {
  const selId = type === 'model' ? 'cfg-model-select' : 'cfg-planner-select';
  const inpId = type === 'model' ? 'cfg-model'        : 'cfg-planner';
  const sel = $(selId);
  const inp = $(inpId);
  if (sel.value === CUSTOM_OPT) {
    sel.style.display = 'none';
    inp.style.display = '';
    inp.focus();
  } else {
    sel.style.display = '';
    inp.style.display = 'none';
  }
}

function showCustomInput(type) {
  const selId = type === 'model' ? 'cfg-model-select' : 'cfg-planner-select';
  const inpId = type === 'model' ? 'cfg-model'        : 'cfg-planner';
  $(selId).style.display = 'none';
  $(inpId).style.display = '';
}

function getModelValue(type) {
  const selId = type === 'model' ? 'cfg-model-select' : 'cfg-planner-select';
  const inpId = type === 'model' ? 'cfg-model'        : 'cfg-planner';
  const sel = $(selId);
  if (sel.style.display === 'none' || sel.value === CUSTOM_OPT) {
    return $(inpId).value.trim();
  }
  return sel.value;
}

// load on page ready
document.addEventListener('DOMContentLoaded', refreshModels);

// ── session ──────────────────────────────────────────────────────────────────
async function startSession() {
  const dir    = $('cfg-dir').value.trim();
  const goal   = $('cfg-goal').value.trim();
  const model  = getModelValue('model');
  const plan   = getModelValue('planner');
  const steps  = parseInt($('cfg-steps').value) || 80;
  const timeout= parseInt($('cfg-timeout').value) || 120;

  if (!dir) { alert('请填写目标目录'); return; }

  if (es) { es.close(); es = null; }
  clearFeed();
  $('summary-box').textContent = '(Ada 完成后显示)';
  $('summary-box').style.color = 'var(--muted)';
  clearAskState();

  setStatus('启动中…', 'badge-running');
  $('btn-start').disabled = true;
  $('btn-stop').disabled = false;

  const res = await fetch('/api/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ target_dir: dir, goal, model, planner_model: plan,
                           max_steps: steps, cmd_timeout: timeout })
  });
  const json = await res.json();
  if (json.error) { alert(json.error); resetUI(); return; }

  currentSid = json.session_id;
  addEntry('entry-log', `<span class="tag tag-step">SESSION</span>${escHtml(currentSid)}`);
  connectStream(currentSid);
}

function connectStream(sid) {
  es = new EventSource(`/api/stream/${sid}`);
  es.onmessage = e => handleEvent(JSON.parse(e.data));
  es.onerror = () => {
    setStatus('连接断开', 'badge-error');
    es.close();
  };
  setStatus('运行中', 'badge-running');
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'ping': break;

    case 'step':
      setStep(ev.data);
      addEntry('entry-step', `─── Step ${ev.data} ───`);
      break;

    case 'assistant':
      addEntry('entry-assistant', escHtml(ev.data));
      break;

    case 'tool': {
      const a = ev.data.args;
      const argsStr = Object.entries(a).map(([k,v])=>`${k}=<em>${escHtml(v)}</em>`).join(', ');
      addEntry('entry-tool',
        `<span class="tag tag-tool">TOOL</span><strong>${escHtml(ev.data.name)}</strong>(${argsStr})`);
      break;
    }

    case 'tool_result': {
      const r = ev.data.result;
      const preview = JSON.stringify(r, null, 2);
      const short = preview.length > 600 ? preview.slice(0,600) + '\n…(truncated)' : preview;
      addEntry('entry-tool-result',
        `<span class="tag tag-result">RESULT</span><code>${escHtml(ev.data.name)}</code>\n${escHtml(short)}`);
      break;
    }

    case 'log':
      addEntry('entry-log', escHtml(ev.data));
      break;

    case 'ask_user':
      waitingForFeedback = true;
      $('ask-notice').classList.add('active');
      $('ask-question').classList.add('active');
      $('ask-question').textContent = ev.data;
      $('feedback-input').focus();
      addEntry('entry-ask',
        `<span class="tag tag-ask">ASK</span>${escHtml(ev.data)}`);
      break;

    case 'user_replied':
      clearAskState();
      break;

    case 'finish':
      setStatus('已完成', 'badge-done');
      setStep(null);
      addEntry('entry-finish',
        `<span class="tag tag-finish">✓ FINISH</span>\n${escHtml(ev.data)}`);
      $('summary-box').textContent = ev.data;
      $('summary-box').style.color = 'var(--green)';
      resetUI(true);
      es.close();
      break;

    case 'done':
      if (ev.data && ev.data.summary) {
        // already handled by finish event usually
      }
      resetUI(true);
      if (es) es.close();
      break;

    case 'error':
      addEntry('entry-error',
        `<span class="tag tag-error">ERROR</span>${escHtml(ev.data)}`);
      setStatus('错误', 'badge-error');
      resetUI(true);
      break;
  }
}

function clearAskState() {
  waitingForFeedback = false;
  $('ask-notice').classList.remove('active');
  $('ask-question').classList.remove('active');
  $('ask-question').textContent = '';
}

function resetUI(finished = false) {
  $('btn-start').disabled = false;
  $('btn-stop').disabled = true;
  if (!finished) setStatus('Idle', 'badge-idle');
}

// ── stop ────────────────────────────────────────────────────────────────────
async function stopSession() {
  if (!currentSid) return;
  await fetch(`/api/stop/${currentSid}`, { method: 'POST' });
  setStatus('停止中…', 'badge-idle');
  addEntry('entry-log', '⚠ 已发送停止信号');
}

// ── feedback ─────────────────────────────────────────────────────────────────
async function sendFeedback() {
  if (!currentSid) { alert('尚未启动 Ada 会话'); return; }
  const text = $('feedback-input').value.trim();
  if (!text) return;

  await fetch(`/api/feedback/${currentSid}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text })
  });

  addEntry('entry-user', `<span class="tag tag-user">YOU</span>${escHtml(text)}`);
  addHistItem(text);
  $('feedback-input').value = '';
  clearAskState();
}

function addHistItem(text) {
  const div = document.createElement('div');
  div.className = 'hist-item';
  div.innerHTML = `<div class="from">${new Date().toLocaleTimeString()}</div>${escHtml(text)}`;
  $('feedback-history').prepend(div);
}

// ── keyboard shortcut ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const el = document.activeElement;
    if (el && el.id === 'feedback-input') sendFeedback();
  }
});

// ── exit server ──────────────────────────────────────────────────────────────
async function exitServer() {
  if (!confirm('确认退出 Ada 服务？所有正在运行的会话将被终止。')) return;
  try {
    await fetch('/api/shutdown', { method: 'POST' });
  } catch (_) {}
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8b949e;font-size:18px;">Ada 服务已退出。</div>';
}
</script>
